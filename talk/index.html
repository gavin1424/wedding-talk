<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>和新人說說話</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2a2018">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=LXGW+WenKai+TC&display=swap">
<style>
/* Layout: the couple fill the screen; words float above their heads, the two names sit at their feet */
:root {
  --cream: #fff9ee; --soft: #e9dcc6; --gold: #c9ad78; --dark: rgba(42,30,18,.62); --groom: #3f4a56; --bride: #b96f62;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif; --hand: "LXGW WenKai TC", "Noto Serif TC", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: #2a2018; color: var(--cream); font-family: var(--serif); font-size: 16px; line-height: 1.6; overflow: hidden; }
/* Wide screens: blurred stage fills the sides, the couple keep the full height */
.backdrop { position: fixed; inset: -40px; background: url(../media/talk/idle.jpg) center/cover; filter: blur(28px) brightness(.72); }
.stage { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100vw, calc(100dvh * 9 / 16)); overflow: hidden; background: #2a2018 url(../media/talk/idle.jpg) center bottom/cover; }
.stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center bottom; opacity: 0; transition: opacity .22s linear; }
.stage[data-clip=idle] .idle, .stage[data-clip=groom] .groom, .stage[data-clip=bride] .bride, .stage[data-clip=bow] .bow, .stage[data-clip=wave] .wave, .stage[data-clip=heart] .heart, .stage[data-clip=look] .look { opacity: 1; }
.zone { position: absolute; z-index: 1; top: 0; bottom: 0; border: 0; padding: 0; background: none; cursor: pointer; }
.zone.g { left: 0; width: 45%; } .zone.b { left: 45%; right: 0; }
.zone:focus-visible { outline: 3px solid var(--gold); outline-offset: -6px; }
.top { position: absolute; z-index: 2; top: 0; left: 0; right: 0; display: grid; justify-items: center; gap: 8px; padding: max(10px, env(safe-area-inset-top, 0px)) 14px 0; pointer-events: none; }
.note { margin: 0; padding: 0 56px; font-size: .7rem; letter-spacing: .04em; color: var(--cream); text-align: center; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
.cap { margin: 0; padding: 8px 16px; border-radius: 14px; background: var(--dark); font-family: var(--hand); font-size: clamp(1.08rem, 2.5vh, 1.5rem); line-height: 1.5; text-align: center; opacity: 0; transition: opacity .25s; }
.cap.on { opacity: 1; }
.fs { position: absolute; z-index: 3; top: max(8px, env(safe-area-inset-top, 0px)); right: 10px; width: 38px; height: 38px; display: grid; place-items: center; padding: 0; border-radius: 50%; border: 1px solid rgba(255,255,255,.55); background: var(--dark); color: var(--cream); cursor: pointer; }
.fs svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.bottom { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; display: grid; gap: 8px; padding: 0 12px max(14px, env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.you { margin: 0; justify-self: center; max-width: 100%; padding: 3px 14px; border-radius: 99px; background: var(--dark); font-size: .92rem; text-align: center; }
.you:empty { display: none; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; pointer-events: auto; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; font: inherit; font-size: .92rem; padding: 6px 14px; border-radius: 99px; border: 1px solid rgba(255,255,255,.5); background: var(--dark); color: var(--cream); cursor: pointer; }
.row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.who { font: inherit; padding: 7px 8px; border-radius: 14px; border: 1px solid rgba(255,255,255,.5); background: var(--dark); color: var(--cream); letter-spacing: .06em; cursor: pointer; pointer-events: auto; }
.who small { display: block; font-size: .72rem; letter-spacing: .2em; opacity: .85; }
.who.g[aria-pressed=true] { background: var(--groom); border-color: var(--gold); }
.who.b[aria-pressed=true] { background: var(--bride); border-color: var(--gold); }
.who:focus-visible, .chips button:focus-visible, .stop:focus-visible, .fs:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.busy .who, .busy .chips button { opacity: .6; pointer-events: none; }
.mid { width: 60px; height: 60px; display: grid; place-items: center; }
.mic { width: 54px; height: 54px; display: grid; place-items: center; border-radius: 50%; background: var(--dark); border: 1px solid rgba(255,255,255,.5); }
.mic svg { width: 24px; height: 24px; fill: none; stroke: var(--cream); stroke-width: 1.7; }
.mic.on { background: #a9503f; border-color: #fff; animation: pulse 1.3s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 11px rgba(169,80,63,.28); } }
.stop { font: inherit; font-size: .9rem; width: 54px; height: 54px; border-radius: 50%; border: 1px solid rgba(255,255,255,.6); background: var(--dark); color: var(--cream); cursor: pointer; pointer-events: auto; }
.veil { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; align-content: center; gap: 12px; width: 100%; border: 0; padding: 24px; background: rgba(42,30,18,.48); color: var(--cream); font: inherit; cursor: pointer; }
.veil i { width: 78px; height: 78px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--cream); animation: pulse 1.8s infinite; }
.veil svg { width: 32px; height: 32px; fill: none; stroke: var(--cream); stroke-width: 1.6; }
.veil b { font-family: var(--hand); font-size: clamp(1.8rem, 6.4vw, 2.5rem); font-weight: 400; letter-spacing: .1em; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
.veil span { letter-spacing: .12em; font-size: .95rem; text-shadow: 0 1px 6px rgba(0,0,0,.7); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<div class="stage" id="stage" data-clip="idle">
  <video class="idle" id="v-idle" src="../media/talk/idle.mp4" poster="../media/talk/idle.jpg" muted loop autoplay playsinline preload="auto" aria-hidden="true"></video>
  <video class="groom" id="v-groom" src="../media/talk/groom.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video class="bride" id="v-bride" src="../media/talk/bride.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video class="bow" id="v-bow" src="../media/talk/bow.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video class="wave" id="v-wave" src="../media/talk/wave.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video class="heart" id="v-heart" src="../media/talk/heart.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video class="look" id="v-look" src="../media/talk/look.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <button type="button" class="zone g" id="zoneG" aria-label="和新郎說話"></button>
  <button type="button" class="zone b" id="zoneB" aria-label="和新娘說話"></button>
  <div class="top">
    <p class="note">AI 數字人．回答為新人事先寫好的內容．合成語音</p>
    <p class="cap" id="cap" aria-live="polite"></p>
  </div>
  <button type="button" class="fs" id="fsBtn" aria-label="全螢幕"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <div class="bottom">
    <p class="you" id="you" aria-live="polite"></p>
    <div class="chips" id="chips" hidden></div>
    <div class="row">
      <button type="button" class="who g" id="pickG" aria-pressed="true"><small>新郎</small><span id="nameG"></span></button>
      <div class="mid">
        <div class="mic" id="mic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
        <button class="stop" type="button" id="stopBtn" hidden>停止</button>
      </div>
      <button type="button" class="who b" id="pickB" aria-pressed="false"><small>新娘</small><span id="nameB"></span></button>
    </div>
  </div>
</div>
<button type="button" class="veil" id="veil" hidden><i><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></i><b>輕觸開始對話</b><span>請允許使用麥克風，直接開口就好</span></button>
<audio id="audio" preload="auto"></audio>
<script>
// One base pose: every clip starts and ends on the same photo, so switching clips never jumps.
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), audio = $('audio'), cap = $('cap'), you = $('you'), chips = $('chips'), stopBtn = $('stopBtn'), mic = $('mic');
  const clips = { idle: $('v-idle'), groom: $('v-groom'), bride: $('v-bride'), bow: $('v-bow'), wave: $('v-wave'), heart: $('v-heart'), look: $('v-look') };
  const params = new URLSearchParams(location.search), debug = params.has('debug');
  let W, QA, who = 'groom', state = 'idle', caps = [], afterAct = null, speak = null, idleTimer = 0, fb = { groom: 0, bride: 0 }, audioDone = false;

  const show = name => {
    const v = clips[name];
    if (name !== 'idle') { v.currentTime = 0; v.play().catch(() => {}); }
    stage.dataset.clip = name;
    for (const k in clips) if (k !== name && k !== 'idle') { clips[k].pause(); }
  };
  const rest = () => {
    state = 'idle'; show('idle'); clips.idle.play().catch(() => {});
    stage.classList.remove('busy'); cap.classList.remove('on'); stopBtn.hidden = true; mic.hidden = noMic; audioDone = false;
    speak = null; afterAct = null; scheduleIdleAct();
    if (handsFree) setTimeout(listen, 600);
  };
  // While nobody is talking the couple now and then share a laugh, then land back on the base pose
  function scheduleIdleAct() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (state === 'idle' && stage.dataset.clip === 'idle') show('look'); else scheduleIdleAct();
    }, 14000 + Math.random() * 10000);
  }
  const finish = () => { if (afterAct) { state = 'acting'; cap.classList.remove('on'); show(afterAct); } else rest(); };
  for (const k of ['bow', 'wave', 'heart', 'look']) clips[k].addEventListener('ended', () => {
    if (state === 'intro' && speak) { const go = speak; speak = null; go(); }
    else if (state === 'acting') rest();
    else if (state === 'idle' && stage.dataset.clip === k) { show('idle'); clips.idle.play().catch(() => {}); scheduleIdleAct(); }
  });
  // Speaking clips play through and return to the base pose; repeat while the voice continues
  for (const k of ['groom', 'bride']) clips[k].addEventListener('ended', () => {
    if (state !== 'talking') return;
    if (audioDone) finish(); else { clips[k].currentTime = 0; clips[k].play().catch(() => {}); }
  });
  audio.addEventListener('ended', () => {
    if (state !== 'talking') return;
    audioDone = true;
    const v = clips[who];
    if (!(v.duration - v.currentTime < 1.2)) finish();   // nearly back at the base pose? let it land there
  });
  audio.addEventListener('timeupdate', () => {
    if (state !== 'talking') return;
    const t = audio.currentTime, c = caps.find(x => t >= x.s && t < x.e + .25);
    if (c) { if (cap.textContent !== c.t) cap.textContent = c.t; cap.classList.add('on'); } else cap.classList.remove('on');
  });
  stopBtn.addEventListener('click', () => { audio.pause(); rest(); });

  const norm = s => s.replace(/[\s，。！？、,.!?~～…「」『』"'：:；;（）()／/]/g, '').toLowerCase();
  function match(text, person) {
    const t = norm(text); let best = null, top = 0;
    for (const it of QA[person]) {
      if (it.fallback || !it.keys) continue;
      let s = 0;
      for (const k of it.keys) if (t.includes(k)) s += k.length * 2 + 1;
      const pool = (it.chip || '') + it.keys.join('');
      for (let i = 0; i < t.length - 1; i++) if (pool.includes(t.slice(i, i + 2))) s += 1;
      if (s > top) { top = s; best = it; }
    }
    if (top >= 2) return best;
    const list = QA[person].filter(x => x.fallback);
    return list[fb[person]++ % list.length];
  }
  // Saying a name (or 新郎 / 新娘) hands the conversation to that person
  function route(text) {
    const t = norm(text);
    if (t.includes('新娘') || t.includes(W.bride.short)) return 'bride';
    if (t.includes('新郎') || t.includes(W.groom.short)) return 'groom';
    return who;
  }
  function answer(text, it, person) {
    if (!it || state !== 'idle') return;
    if (rec) rec.abort();
    pick(person);
    if (text || !noMic) you.textContent = text ? '你說：' + text : '';
    clearTimeout(idleTimer);
    audio.src = `../media/talk/${person}/${it.id}.mp3`;
    caps = it.caps || []; afterAct = it.after || null; audioDone = false;
    stage.classList.add('busy'); mic.classList.remove('on'); mic.hidden = true; stopBtn.hidden = false;
    const talk = () => { state = 'talking'; show(person); audio.play().catch(rest); };
    if (it.before) { state = 'intro'; speak = talk; show(it.before); } else talk();
  }
  function ask(text) { const p = route(text); answer(text, match(text, p), p); }
  function pick(person) {
    if (who === person && chips.childElementCount) return;
    who = person;
    $('pickG').setAttribute('aria-pressed', person === 'groom'); $('pickB').setAttribute('aria-pressed', person === 'bride');
    chips.replaceChildren(...QA[person].filter(x => x.chip).map(it => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = it.chip;
      b.addEventListener('click', () => answer(it.chip, it, person));
      return b;
    }));
  }
  const choose = person => { if (state !== 'idle') return; pick(person); const hi = QA[person].find(x => x.id === 'hello'); answer('', hi, person); };
  $('zoneG').onclick = $('pickG').onclick = () => choose('groom');
  $('zoneB').onclick = $('pickB').onclick = () => choose('bride');

  // Local test stand-in for the microphone: ?debug fakes hearing, ?debug&nomic acts like a browser without speech recognition
  class FakeSR { start() { window.__sr = this; } abort() { window.__sr = null; this.onend && this.onend(); } }
  const SR = debug ? (params.has('nomic') ? null : FakeSR) : (window.SpeechRecognition || window.webkitSpeechRecognition);
  let rec = null, handsFree = false, noMic = !SR;
  // Voice is the only way in; the question buttons appear only where the browser cannot listen
  function micFallback(msg) { noMic = true; handsFree = false; mic.hidden = true; mic.classList.remove('on'); chips.hidden = false; you.textContent = msg; }
  function listen() {
    if (!handsFree || rec || state !== 'idle' || noMic) return;
    rec = new SR(); rec.lang = 'zh-TW'; rec.interimResults = true;
    let heard = '';
    rec.onresult = e => { heard = Array.from(e.results, r => r[0].transcript).join(''); you.textContent = '你說：' + heard; };
    rec.onerror = e => { if (['not-allowed', 'service-not-allowed', 'audio-capture'].includes(e.error)) micFallback('麥克風沒有開啟，可以點下面的問題。'); };
    rec.onend = () => { rec = null; mic.classList.remove('on'); const t = heard.trim(); if (t) ask(t); else if (handsFree) setTimeout(listen, 300); };
    you.textContent = `${W[who].short}在聽，直接說…`;
    mic.classList.add('on');
    try { rec.start(); } catch { rec = null; mic.classList.remove('on'); }
  }

  // First hello opens with both of them waving, then the microphone stays on by itself
  const start = () => {
    handsFree = !noMic;
    if (noMic) micFallback('這個瀏覽器無法語音對話，可以點下面的問題，或改用 Chrome、Safari 開啟。');
    pick(who); const hi = QA[who].find(x => x.id === 'hello'); answer('', { ...hi, before: 'wave' }, who);
  };
  const soundAllowed = () => navigator.getAutoplayPolicy ? navigator.getAutoplayPolicy('mediaelement') === 'allowed' : false;
  const goFull = () => { if (!debug && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); };
  $('veil').addEventListener('click', () => { $('veil').hidden = true; goFull(); start(); });

  if (debug) window.__talk = { state: () => ({ state, who, clip: stage.dataset.clip, listening: mic.classList.contains('on'), chips: !chips.hidden }), ask,
    hear: t => { const r = window.__sr; if (!r) return false; r.onresult({ results: [[{ transcript: t }]] }); window.__sr = null; r.onend(); return true; } };

  $('fsBtn').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : goFull());
  document.addEventListener('fullscreenchange', () => { $('fsBtn').hidden = !!document.fullscreenElement; });
  if (!document.documentElement.requestFullscreen) $('fsBtn').hidden = true;

  Promise.all([fetch('../wedding.json').then(r => r.json()), fetch('../media/talk/qa.json', { cache: 'no-cache' }).then(r => r.json())]).then(([w, q]) => {
    W = w; QA = q;
    $('nameG').textContent = W.groom.name; $('nameB').textContent = W.bride.name;
    pick('groom');
    if (soundAllowed()) start(); else $('veil').hidden = false;
  }).catch(() => { you.textContent = '內容載入失敗，請重新整理。'; });
})();
</script>
</body>
</html>
