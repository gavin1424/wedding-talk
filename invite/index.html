<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>誠摯邀請</title>
<meta name="theme-color" content="#f7f1e6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=LXGW+WenKai+TC&family=Cormorant+Garamond:ital@1&display=swap">
<style>
:root { --bg: #f7f1e6; --paper: #fdf9f0; --ink: #3b2f24; --soft: #6e5f4e; --gold: #94743c; --gold-soft: #c9ad78; --rose: #b96f62; --line: rgba(148,116,60,.32);
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif; --hand: "LXGW WenKai TC", "Noto Serif TC", serif; --latin: "Cormorant Garamond", serif; color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg) url(../img/invite/paper.jpg); color: var(--ink); font-family: var(--serif); font-size: 17px; line-height: 1.9; }
body.locked { overflow: hidden; height: 100dvh; }
a { color: inherit; }
/* Envelope gate */
.gate { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; align-content: center; gap: 22px; width: 100%; padding: 24px; border: 0; background: var(--bg) url(../img/invite/paper.jpg); color: var(--ink); font: inherit; cursor: pointer; transition: opacity .7s ease .65s, visibility 0s linear 1.4s; perspective: 1200px; }
.gate:focus-visible { outline: 3px solid var(--gold-soft); outline-offset: -8px; }
/* The envelope photo is zoomed so its paper fills the box; the flap is the same photo clipped to the V */
.env { position: relative; width: min(84vw, 520px); aspect-ratio: 1312/693; background: #f3ebdb url(../img/invite/envelope.jpg) 50% 50.5%/122% auto no-repeat; border-radius: 3px; box-shadow: 0 26px 50px -22px rgba(70,50,25,.5); }
.env::before { content: ""; position: absolute; inset: 0; background: #d9ccb3; clip-path: polygon(0 0, 100% 0, 50% 76%); opacity: 0; transition: opacity .2s; }
.flap { position: absolute; inset: 0; background: url(../img/invite/envelope.jpg) 50% 50.5%/122% auto no-repeat; clip-path: polygon(0 0, 100% 0, 50% 76%); transform-origin: top; transition: transform .75s cubic-bezier(.6,.05,.3,1); }
.gate.open .env::before { opacity: 1; }
.seal { position: absolute; left: 50%; top: 74%; width: 19%; aspect-ratio: 1; transform: translate(-50%,-50%); border-radius: 50%; background: radial-gradient(circle at 35% 30%, #d8bd86, #a8843f 72%) center/cover; transition: opacity .3s; }
.seal:has(img) { background: none; }
.seal img { width: 118%; margin: -9%; display: block; }
.gate p { margin: 0; text-align: center; } .gate .to { font-family: var(--hand); font-size: clamp(1.5rem, 5.4vw, 2.2rem); letter-spacing: .12em; }
.gate .tap { color: var(--soft); letter-spacing: .2em; font-size: .9rem; animation: breathe 2.2s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .45; } }
.gate.open { opacity: 0; visibility: hidden; pointer-events: none; }
.gate.open .flap { transform: rotateX(178deg); } .gate.open .seal { opacity: 0; }
/* Hero */
.hero { position: relative; height: 100dvh; min-height: 620px; overflow: hidden; display: grid; justify-items: center; background: linear-gradient(180deg, #f6ece0, #e9dcc6 70%, #d8cdb4); }
.hero picture { position: absolute; inset: 0; }
.hero picture img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero::before { content: ""; position: absolute; z-index: 1; bottom: -2%; left: 50%; width: min(90vw, 620px); height: 11%; transform: translateX(-50%); background: radial-gradient(closest-side, rgba(45,35,20,.42), transparent); }
.hero::after { content: ""; position: absolute; inset: 0 0 auto; height: 46%; background: linear-gradient(180deg, rgba(247,241,230,.92) 30%, rgba(247,241,230,0)); }
.hero .title { position: relative; z-index: 3; align-self: start; text-align: center; padding-top: max(5vh, env(safe-area-inset-top, 0px)); }
.eyebrow { font-family: var(--latin); font-style: italic; color: var(--gold); font-size: 1.1rem; letter-spacing: .08em; }
.names { margin: 2px 0 0; font-weight: 600; font-size: clamp(1.9rem, 6.6vw, 3.4rem); letter-spacing: .14em; line-height: 1.35; }
.names i { font-style: normal; color: var(--rose); font-weight: 400; padding: 0 .1em; }
.when { margin: 4px 0 0; color: var(--soft); letter-spacing: .14em; font-size: clamp(.92rem, 2.4vw, 1.1rem); }
.couple { position: absolute; z-index: 2; bottom: -1%; left: 50%; height: min(74%, 150vw); transform: translateX(-50%); max-width: none; }
/* Sections */
section { max-width: 720px; margin: 0 auto; padding: clamp(56px, 11vw, 96px) 22px; text-align: center; }
h2 { margin: 0 0 6px; font-weight: 600; font-size: clamp(1.4rem, 4.4vw, 1.9rem); letter-spacing: .24em; }
.divider { display: block; width: min(320px, 70%); height: auto; margin: 10px auto 28px; }
.divider.plain { height: 1px; background: linear-gradient(90deg, transparent, var(--gold-soft), transparent); }
.letter { font-family: var(--hand); font-size: clamp(1.15rem, 3.6vw, 1.45rem); line-height: 2.15; margin: 0; }
.count { display: flex; justify-content: center; gap: clamp(18px, 7vw, 46px); margin-top: 34px; }
.count b { display: block; font-size: clamp(2rem, 8vw, 3rem); font-weight: 400; line-height: 1.15; font-variant-numeric: tabular-nums; }
.count span { font-size: .82rem; letter-spacing: .3em; color: var(--soft); }
.story { list-style: none; margin: 0; padding: 0; display: grid; gap: 28px; text-align: left; }
.story li { display: grid; grid-template-columns: 76px 1fr; gap: 18px; align-items: baseline; }
.story time { font-family: var(--latin); font-style: italic; color: var(--gold); font-size: 1.5rem; }
.story h3 { margin: 0; font-size: 1.1rem; font-weight: 600; letter-spacing: .1em; }
.story p { margin: 2px 0 0; color: var(--soft); }
.venue-pic { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 4px; margin-bottom: 26px; display: block; }
dl { margin: 0; text-align: left; display: grid; grid-template-columns: 5em 1fr; row-gap: 12px; }
dt { color: var(--gold); letter-spacing: .14em; } dd { margin: 0; }
.btn { display: inline-block; font: inherit; letter-spacing: .16em; padding: 11px 30px; border-radius: 99px; border: 1px solid var(--gold); background: var(--gold); color: #fffaf1; text-decoration: none; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--gold); }
.btn:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 3px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 28px; }
form { display: grid; gap: 16px; text-align: left; }
label, legend { font-size: .95rem; letter-spacing: .08em; color: var(--soft); }
fieldset { border: 0; padding: 0; margin: 0; }
input[type=text], input[type=number], textarea { display: block; width: 100%; margin-top: 4px; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
input:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold-soft); }
.radios { display: flex; gap: 20px; margin-top: 4px; color: var(--ink); } .radios label { color: var(--ink); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.done { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; text-align: left; white-space: pre-line; margin-top: 18px; }
.talk { background: rgba(148,116,60,.09); max-width: none; }
.talk p { color: var(--soft); margin: 0 0 22px; }
footer { text-align: center; padding: 30px 20px 46px; color: var(--soft); font-size: .86rem; letter-spacing: .1em; }
.reveal { opacity: 0; transform: translateY(18px); transition: opacity .8s, transform .8s; } .reveal.in { opacity: 1; transform: none; }
.corner { position: absolute; top: 0; left: 0; width: min(38vw, 300px); pointer-events: none; z-index: 2; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .reveal { opacity: 1; transform: none; } html { scroll-behavior: auto; } }
</style>
</head>
<body class="locked">
<button type="button" class="gate" id="gate" aria-label="拆開喜帖">
  <div class="env"><div class="flap"></div><div class="seal"><img src="../img/invite/wax-seal.png" alt="" onerror="this.remove()"></div></div>
  <p class="to" data-f="toLine"></p>
  <p class="tap">輕觸拆開喜帖</p>
</button>

<div class="hero">
  <picture><source media="(max-width:760px)" srcset="../img/invite/hero-mobile.jpg"><img class="bg" src="../img/invite/hero-desktop.jpg" alt="" onerror="this.parentNode.remove()"></picture>
  <img class="corner" src="../img/invite/floral-corner.png" alt="" onerror="this.remove()">
  <div class="title">
    <div class="eyebrow">We're getting married</div>
    <h1 class="names"><span data-f="gName"></span><i>&amp;</i><span data-f="bName"></span></h1>
    <p class="when" data-f="whenLine"></p>
  </div>
  <img class="couple" src="../img/couple.webp" alt="新郎與新娘的全身合照">
</div>

<main>
  <section class="reveal">
    <h2>誠摯邀請</h2><img class="divider" src="../img/invite/divider.png" alt="" onerror="this.outerHTML='<span class=\'divider plain\'></span>'">
    <p class="letter">我們要結婚了。<br>在往後最重要的日子裡，<br>想請最重要的你，<br>來見證這份幸福。</p>
    <div class="count" aria-label="距離婚禮倒數"><div><b id="cD">0</b><span>天</span></div><div><b id="cH">0</b><span>時</span></div><div><b id="cM">0</b><span>分</span></div></div>
  </section>

  <section class="reveal">
    <h2>我們的故事</h2><img class="divider" src="../img/invite/divider.png" alt="" onerror="this.outerHTML='<span class=\'divider plain\'></span>'">
    <ol class="story" id="story"></ol>
  </section>

  <section class="reveal">
    <h2>婚宴資訊</h2><img class="divider" src="../img/invite/divider.png" alt="" onerror="this.outerHTML='<span class=\'divider plain\'></span>'">
    <img class="venue-pic" src="../img/invite/venue.jpg" alt="婚宴會場" onerror="this.remove()">
    <dl><dt>日期</dt><dd data-f="dateLine"></dd><dt>時間</dt><dd data-f="timeShort"></dd><dt>地點</dt><dd data-f="placeLine"></dd><dt>地址</dt><dd data-f="address"></dd><dt>停車</dt><dd data-f="parking"></dd><dt>大眾運輸</dt><dd data-f="transit"></dd><dt>服裝</dt><dd data-f="dress"></dd></dl>
    <div class="row"><a class="btn" id="mapLink" target="_blank" rel="noopener">開啟地圖導航</a></div>
  </section>

  <section class="reveal" id="rsvp">
    <h2>回覆出席</h2><img class="divider" src="../img/invite/divider.png" alt="" onerror="this.outerHTML='<span class=\'divider plain\'></span>'">
    <p style="margin-top:0;color:var(--soft)">請在 <span data-f="rsvpBy"></span> 前告訴我們</p>
    <form id="rsvpForm">
      <label>您的姓名<input type="text" id="rName" required autocomplete="name"></label>
      <fieldset><legend>是否出席</legend><div class="radios"><label><input type="radio" name="go" value="會出席" checked> 會出席</label><label><input type="radio" name="go" value="無法出席"> 無法出席</label></div></fieldset>
      <div class="two"><label>出席人數<input type="number" id="rN" min="0" max="20" value="1"></label><label>素食人數<input type="number" id="rV" min="0" max="20" value="0"></label></div>
      <label>想對我們說的話<textarea id="rMsg" rows="2"></textarea></label>
      <div class="row" style="margin-top:4px"><button class="btn" type="submit">產生回覆</button></div>
    </form>
    <div id="rsvpDone" hidden>
      <div class="done" id="rsvpText"></div>
      <div class="row"><a class="btn" id="lineLink" target="_blank" rel="noopener">用 LINE 傳給新人</a><button class="btn ghost" type="button" id="copyBtn">複製文字</button></div>
    </div>
  </section>

  <section class="reveal talk">
    <h2>想問新人什麼嗎？</h2><span class="divider plain"></span>
    <p>新郎、新娘的數字人可以分別和你聊天，時間地點、戀愛故事都能問。</p>
    <a class="btn" href="../talk/">和新人說說話</a>
  </section>
</main>
<footer><span data-f="pair"></span>　敬邀</footer>

<script>
fetch('../wedding.json').then(r => r.json()).then(W => {
  const F = { gName: W.groom.name, bName: W.bride.name, pair: `${W.groom.name}・${W.bride.name}`, toLine: `${W.groom.short} & ${W.bride.short} 的喜帖`,
    whenLine: `${W.dateText}　${W.weekday}`, dateLine: `${W.dateText}（${W.weekday}）${W.lunar}`, timeShort: W.timeShort, placeLine: `${W.venue}　${W.hall}`,
    address: W.address, parking: W.parking, transit: W.transit, dress: W.dress, rsvpBy: W.rsvpBy };
  document.querySelectorAll('[data-f]').forEach(n => { n.textContent = F[n.dataset.f]; });
  document.title = `${W.groom.short} & ${W.bride.short} 誠摯邀請`;
  document.getElementById('mapLink').href = W.mapUrl;
  document.getElementById('story').replaceChildren(...W.story.map(s => {
    const li = document.createElement('li'), t = document.createElement('time'), d = document.createElement('div'), h = document.createElement('h3'), p = document.createElement('p');
    t.textContent = s.year; h.textContent = s.title; p.textContent = s.text; d.append(h, p); li.append(t, d); return li;
  }));
  const target = new Date(W.dateISO).getTime(), set = (id, v) => { document.getElementById(id).textContent = v; };
  const tick = () => { const d = Math.max(0, target - Date.now()); set('cD', Math.floor(d / 864e5)); set('cH', Math.floor(d / 36e5) % 24); set('cM', Math.floor(d / 6e4) % 60); };
  tick(); setInterval(tick, 30000);

  // RSVP has no server: it writes the reply and hands it to LINE
  document.getElementById('rsvpForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = id => document.getElementById(id).value.trim(), go = document.querySelector('input[name=go]:checked').value;
    const lines = [`【喜帖回覆】${W.groom.short} & ${W.bride.short}`, `姓名：${v('rName')}`, go];
    if (go === '會出席') lines.push(`人數：${v('rN')} 位`, `素食：${v('rV')} 位`);
    if (v('rMsg')) lines.push(`想說的話：${v('rMsg')}`);
    const text = lines.join('\n');
    document.getElementById('rsvpText').textContent = text;
    document.getElementById('lineLink').href = (W.rsvpLine || 'https://line.me/R/share?text=') + (W.rsvpLine ? '' : encodeURIComponent(text));
    const done = document.getElementById('rsvpDone'); done.hidden = false; done.scrollIntoView({ block: 'center' });
    document.getElementById('copyBtn').onclick = async ev => { try { await navigator.clipboard.writeText(text); ev.target.textContent = '已複製'; } catch { ev.target.textContent = '請長按上方文字複製'; } };
  });
});
const gate = document.getElementById('gate');
gate.addEventListener('click', () => { gate.classList.add('open'); document.body.classList.remove('locked'); }, { once: true });
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12 });
document.querySelectorAll('.reveal').forEach(n => io.observe(n));
</script>
</body>
</html>
